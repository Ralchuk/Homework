<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="./new_style/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=how_to_reg"
    />
  </head>
  <body>
    <div class="registration">
      <form action="/submit" method="get">
        <!-- header -->
        <div class="header-registration">
          <span><a href="./registration.html" class="login_registration">Login</a></span>
          <span>|</span>
          <span
            ><a href="./registration.html" class="register_registration">Register</a></span
          >
        </div>

        <!-- Enter your email and password to register. -->

        <div class="enter_to_register">Enter your email and password to register.</div>
        <div class="input_enter_to_register">
          <input type="text" placeholder="Username" />
          <input type="email" placeholder="Enter your email" />
          <div class="password_enter_to_register">
            <input type="password" placeholder="Password" />
            
            <img
              class="eye"
              src="./images/img-registration/free-icon-hide-2767146.png"
              alt="eye"
            />
          </div>
          <input type="password" placeholder="Confirm Password" />
        </div>

        <!-- Button Register  -->

        <div class="button-register">
          <button class="submit">
            <span class="material-symbols-outlined"> how_to_reg </span>
            
            <span>Register</span>
          </button>
        </div>

        <!-- Or register with -->

        <div class="or-register-with">
          <div class="hr"></div>
          <div class="or">Or register with</div>
          <div class="hr"></div>
        </div>
      </form>

      <!-- Google and Facebook-->

      <div class="other-buttons-social">
        <a href="https://google.com/">
          <button class="button">
            <img width="20px" src="./images/img-registration/google.png" alt="google" />
            <span>Continue with Google</span>
          </button>
        </a>

        <a href="https://google.com/">
          <button class="button">
            <img width="20px" src="./images/img-registration/facebook.png" alt="facebook" />
            <span>Continue with Facebook</span>
          </button>
        </a>
      </div>

      <!-- Green shape in bottom -->

      <div class="green-shape"></div>

      <!-- Close -->

      <div class="close-registration">
        <a href="./index.html">
          <button class="close-registration-button">
          <img
            class="close-registration-img"
            src="./images/img-registration/close.png"
            alt="close"
          />
        </button>
        </a>
        
      </div>
    </div>
  </body>
</html>
