<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="registration">
      <form action="/submit" method="get">
        <!-- header -->
        <div class="header">
          <span><a href="./registration.html" class="login">Login</a></span>
          <span>|</span>
          <span
            ><a href="./registration.html" class="register">Register</a></span
          >
        </div>

        <!-- Enter your email and password to register. -->

        <div class="enter">Enter your email and password to register.</div>
        <div class="input">
          <input type="text" placeholder="Username" />
          <input type="email" placeholder="Enter your email" />
          <div class="password">
            <input type="password" placeholder="Password" />
            <img class="eye" src=".img/free-icon-hide-2767146.png" alt="eye" />
          </div>
          <input type="password" placeholder="Confirm Password" />
        </div>

        <!-- Button Register  -->

        <div class="button-register">
          <input class="submit" type="submit" value="Register" />
        </div>

        <!-- Or register with -->

        <div class="Or-register-with">
          <div class="hr"><hr /></div>
          <div class="or">Or register with</div>
          <div class="hr"><hr /></div>
        </div>
      </form>

      <!-- Google and Facebook-->

      <div class="other-buttons">
        <a href="https://google.com/">
          <button class="button">
            <img src=".img/google.png" alt="google" />
            <span>Continue with Google</span>
          </button>
        </a>

        <a href="https://google.com/">
          <button class="button">
            <img src=".img/facebook.png" alt="facebook" />
            <span>Continue with Facebook</span>
          </button>
        </a>
      </div>

      <!-- Green shape in bottom -->

      <div class="green-shape"></div>

      <!-- Close -->

      <div class="close">
        <button class="close-button">
          <img class="close-img" src=".img/close.png" alt="close" />
        </button>
      </div>
    </div>
  </body>
</html>
